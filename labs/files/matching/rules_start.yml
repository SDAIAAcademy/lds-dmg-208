# قواعد المطابقة: ملف البداية في المختبر 1.1. انسخه إلى my_rules.yml وغيّر النسخة.
# كل خيار معطّل حتى تشغّله. التشغيل:  uv run kit/match.py my_rules.yml

standardise:
  arabic:
    unify_alef: false        # أ إ آ  تصبح  ا
    taa_marbuta: false       # ة في آخر الكلمة تصبح ه
    alef_maqsura: false      # ى في آخر الكلمة تصبح ي
    remove_diacritics: false # حذف الحركات: الفتحة والضمة والكسرة والشدة والسكون
    remove_tatweel: false    # حذف التطويل ـ
  latin:
    lowercase: true          # الحروف اللاتينية كلها صغيرة
    unify_article: false     # Al- وEl وAL تصبح al
  strip_punctuation: false   # حذف النقاط والفواصل والشرطات و& والأقواس
  remove_words: []           # كلمات لا تميّز موردًا من آخر، بالعربية والإنجليزية: تُحذف من الاسم قبل المقارنة
  key_remove_words: []       # كلمات تُحذف من المفتاح العابر للغتين وحده، وتبقى في الاسم
  cross_script_key: false    # مفتاح من الحروف الساكنة يلتقي فيه الاسم العربي بصيغته الإنجليزية

numbers:
  digits_only: false         # 9912 345 678 و9912-345678 تصبحان 9912345678
  phone_local: false         # +966599... و966 59 ... تصبحان 0599...
  placeholders: []           # قيم تعني «غير معروف» في رقم السجل؛ ابحث عنها في الملف بنفسك

blocking:                    # كل سطر: السجلات التي تتفق في كل أعمدته تُقارن
  - [name_std]
  - [cr_number]

deterministic:               # كل سطر: السجلات التي تتفق في كل أعمدته مطابقة دون درجة
  - [cr_number]

compare:
  name: [0.92, 0.80]         # مستويا تشابه الاسم (Jaro-Winkler)، الأفضل بين الاسم والاسم البديل
  name_key: false            # يحتاج cross_script_key
  cr_number: true
  vat_number: false
  phone: true
  email: true
  city: exact                # exact، أو key (المدينة نفسها مكتوبة بالعربية أو بالإنجليزية)

thresholds: [0.50, 0.90]     # الأولى بداية قائمة المراجعة، والثانية الدمج الآلي

hold_back: []                # كل سطر: السجلات التي تختلف في هذه الأعمدة تنتظر المراجعة ولا تُدمج آليًا
