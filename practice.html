<section>
<h2>اليوم 1: من ثلاثة أنظمة إلى سجل واحد</h2>
<ol>
<li><p>هيئة لها خمسة أنظمة قديمة لكل منها مالك يرفض أي تغيير. تريد أن تعرف في أي نظام يوجد ملف المستفيد قبل الرد على طلبه، ولا تحتاج تقريرًا موحدًا.</p><ul><li><b>أ.</b> السجل المرجعي: فهرس بالمعرفات يشير إلى الأنظمة</li><li><b>ب.</b> التوحيد: تُنسخ السجلات إلى المحور ويُبنى منها سجل ذهبي</li><li><b>ج.</b> التعايش: مزامنة في الاتجاهين مع الأنظمة</li><li><b>د.</b> المركزي: إنشاء الملف في المحور وحده</li></ul></li>
<li><p>شركة نقل لها ثلاثة أنظمة للعملاء. الإدارة تريد تقريرًا شهريًا موحدًا بعدد العملاء وقيمة تعاملاتهم، وكل نظام يبقى مكان إدخال العميل وتعديله.</p><ul><li><b>أ.</b> السجل المرجعي: فهرس بالمعرفات يشير إلى الأنظمة الثلاثة</li><li><b>ب.</b> التعايش: يعود السجل الذهبي إلى الأنظمة</li><li><b>ج.</b> التوحيد: نسخ في اتجاه واحد وسجل ذهبي للتقارير</li><li><b>د.</b> المركزي: يُدخل العميل في المحور وحده</li></ul></li>
<li><p>مستشفى يصحح عنوان المريض في المحور بعد التحقق منه، ويريد أن يظهر التصحيح في نظام المواعيد ونظام الفوترة، مع بقاء الإدخال ممكنًا فيهما.</p><ul><li><b>أ.</b> السجل المرجعي: فهرس يشير إلى النظامين</li><li><b>ب.</b> التعايش: مزامنة السجل في الاتجاهين</li><li><b>ج.</b> التوحيد: نسخ من النظامين إلى المحور</li><li><b>د.</b> المركزي: الإدخال في المحور وحده</li></ul></li>
<li><p>جهة تستبدل أنظمة المشتريات الثلاثة بنظام واحد. قرر المالك أن تسجيل المورد وتعديله يتمان في وحدة واحدة، والأنظمة الأخرى تقرأ منها فقط.</p><ul><li><b>أ.</b> التوحيد: تُنسخ السجلات من الأنظمة إلى المحور</li><li><b>ب.</b> التعايش: مزامنة مع الأنظمة في الاتجاهين</li><li><b>ج.</b> السجل المرجعي: فهرس بالمعرفات يشير إلى الأنظمة الثلاثة</li><li><b>د.</b> المركزي: المحور هو المصدر الوحيد</li></ul></li>
<li><p>في سجل الجهات الشريكة، الاستدعاء على الأزواج العربية الإنجليزية 31% وعلى الأزواج العربية 88%. الدقة فوق 95% في الصنفين. ماذا تغيّر أولًا؟</p><ul><li><b>أ.</b> خفض عتبة الدمج من 0.9 إلى 0.6</li><li><b>ب.</b> تشغيل توحيد الهمزة والتاء المربوطة</li><li><b>ج.</b> إضافة المفتاح العابر للغتين إلى التكتيل</li><li><b>د.</b> قاعدة حتمية تدمج كل زوج يتفق في الحرف الأول من الاسم</li></ul></li>
<li><p>في سجل الجهات الشريكة يحدّث الباحثون الزائرون هاتف الجهة في كل زيارة، والمنح تنسخه مرة عند فتح الملف، والاتفاقيات نُقلت دفعة واحدة فتاريخ كل سجلاتها يوم النقل. أي قاعدة للهاتف؟</p><ul><li><b>أ.</b> أولوية المصدر: المنح أولًا، لأنها الأوثق في الاسم</li><li><b>ب.</b> الأحدث، بتواريخ المصادر الثلاثة كما هي</li><li><b>ج.</b> الأكثر تكرارًا بين المصادر الثلاثة</li><li><b>د.</b> الأحدث، مع استبعاد تواريخ الاتفاقيات</li></ul></li>
<li><p>أمانة مدينة لها أربعة أنظمة للرخص التجارية، ولكل نظام فريق يُدخل الرخص ويعدّلها. تريد الأمانة لوحة شهرية موحدة بعدد الرخص السارية، ولا تريد تغيير طريقة الإدخال. أي نمط يناسبها؟</p><ul><li><b>أ.</b> السجل المرجعي: فهرس بالمعرفات يشير إلى الأنظمة الأربعة</li><li><b>ب.</b> المركزي: تُدخل الرخص في المحور وحده</li><li><b>ج.</b> التوحيد: نسخ في اتجاه واحد وسجل ذهبي للتقارير</li><li><b>د.</b> التعايش: يعود السجل الذهبي إلى الأنظمة الأربعة</li></ul></li>
<li><p>كلية تصحح البريد الإلكتروني للطالب في المحور بعد التحقق منه، وتريد أن يصل التصحيح إلى نظام المكتبة ونظام السكن، مع بقاء التسجيل ممكنًا في النظامين. أي نمط يناسبها؟</p><ul><li><b>أ.</b> التعايش: مزامنة السجل في الاتجاهين</li><li><b>ب.</b> التوحيد: نسخ من النظامين إلى المحور</li><li><b>ج.</b> السجل المرجعي: فهرس بمعرفات الطالب</li><li><b>د.</b> المركزي: التسجيل في المحور وحده</li></ul></li>
<li><p>جهة لها ستة أنظمة لطلبات المستفيدين يرفض ملاكها أي تغيير. يحتاج موظف خدمة العملاء أن يعرف في أي نظام يوجد طلب المستفيد قبل أن يرد عليه. أي نمط يناسبها؟</p><ul><li><b>أ.</b> التوحيد: نسخة موحدة من الطلبات للتقارير</li><li><b>ب.</b> التعايش: مزامنة في الاتجاهين مع الأنظمة الستة</li><li><b>ج.</b> المركزي: الطلبات في المحور وحده</li><li><b>د.</b> السجل المرجعي: فهرس بمعرفات الطلبات</li></ul></li>
<li><p>تصمم جهة حكومية محورًا لقائمة المناطق وقائمة أنواع المنشآت، وتسأل عن النمط الذي تنص عليه ضوابط مكتب إدارة البيانات الوطنية لهذا النوع من البيانات. أي نمط؟</p><ul><li><b>أ.</b> السجل المرجعي، فلكل نظام قائمته</li><li><b>ب.</b> المركزي، فتُدار القوائم في المحور وحده</li><li><b>ج.</b> التعايش، فكل نظام يعدّل القوائم ويزامنها</li><li><b>د.</b> التوحيد، فتُجمع قوائم الأنظمة في نسخة للتقارير</li></ul></li>
<li><p>في سجل الأطباء الزائرين بمستشفى، 30 زوجًا موسومًا منها 12 متطابقًا. قالت أداة المطابقة «متطابق» لعشرة أزواج، تسعة منها متطابقة فعلًا. ما الدقة والاستدعاء؟</p><ul><li><b>أ.</b> الدقة 75.0% والاستدعاء 90.0%</li><li><b>ب.</b> الدقة 90.0% والاستدعاء 83.3%</li><li><b>ج.</b> الدقة 90.0% والاستدعاء 75.0%</li><li><b>د.</b> الدقة 30.0% والاستدعاء 75.0%</li></ul></li>
<li><p>في سجل الجمعيات المستفيدة من المنح 25 زوجًا متطابقًا موسومًا. مفاتيح التكتيل الحالية تجمع 22 منها فقط في كتلة واحدة. ما أعلى استدعاء يمكن أن تبلغه المطابقة بأي عتبة؟</p><ul><li><b>أ.</b> 100%، بعتبة منخفضة</li><li><b>ب.</b> 88.0%، أي 22 زوجًا من 25</li><li><b>ج.</b> 22.0%، بعدد الأزواج في الكتل</li><li><b>د.</b> لا سقف يُعرف قبل اختيار العتبة</li></ul></li>
<li><p>في سجل الصيدليات المتعاقدة، قاعدة حتمية «رقم الترخيص نفسه يعني الصيدلية نفسها» جمعت 900 سجل في عنقود واحد. أكثر قيمة تكرارًا في رقم الترخيص هي «-». ماذا تفعل أولًا؟</p><ul><li><b>أ.</b> ترفع عتبة الدمج من 0.9 إلى 0.99</li><li><b>ب.</b> تحذف القاعدة الحتمية وتكتفي بالمطابقة الاحتمالية</li><li><b>ج.</b> تعلن «-» قيمة بديلة لا تُقارن، ثم تعيد التشغيل</li><li><b>د.</b> تضيف الاسم إلى مفاتيح التكتيل</li></ul></li>
<li><p>في سجل مقاولي الصيانة، شركتان تشتركان في الاسم التجاري والهاتف والبريد، وتختلفان في رقم السجل التجاري والنشاط. القواعد تدمجهما آليًا. أي تغيير يمنع هذا دون أن يُسقط الاستدعاء؟</p><ul><li><b>أ.</b> حذف الهاتف والبريد من المقارنة</li><li><b>ب.</b> رفع عتبة الدمج الآلي من 0.95 إلى 0.999</li><li><b>ج.</b> قاعدة حجز للأزواج التي يختلف رقما سجلها</li><li><b>د.</b> حذف كلمة النشاط من الاسم قبل المقارنة والتكتيل</li></ul></li>
<li><p>في سجل المتعاقدين بإدارة المرافق، يحدّث نظام الزيارات الميدانية عنوان المتعاقد في كل زيارة. ونظام العقود نُقل من نظام قديم في يوم واحد، فتاريخ التحديث في كل سجلاته يوم النقل. أي قاعدة للعنوان؟</p><ul><li><b>أ.</b> الأكثر تكرارًا بين المصادر</li><li><b>ب.</b> الأحدث، بتواريخ المصادر كما هي</li><li><b>ج.</b> أولوية المصدر: نظام العقود أولًا ثم الزيارات</li><li><b>د.</b> الأحدث، مع استبعاد تواريخ نظام العقود</li></ul></li>
<li><p>في سجل الجهات المانحة، يأخذ نظام المنح الاسم العربي من الخطاب الرسمي للجهة، ونظام الفعاليات يكتبه موظف الاستقبال كما يسمعه، وكلاهما يحدّث سجلاته باستمرار. أي قاعدة للاسم العربي؟</p><ul><li><b>أ.</b> أولوية المصدر: نظام المنح أولًا</li><li><b>ب.</b> الأحدث بين النظامين، فكلاهما يحدّث سجلاته</li><li><b>ج.</b> الأكثر تكرارًا بين النظامين</li><li><b>د.</b> الأكمل: الاسم الأطول</li></ul></li>
<li><p>اكتشف المشرف بعد شهر أن سجلًا ذهبيًا في سجل المتبرعين جمع متبرعين مختلفين. ما الذي يلزم ليفك الدمج ويعيد كل سجل مصدري إلى صاحبه؟</p><ul><li><b>أ.</b> تاريخ آخر تحديث للسجل الذهبي</li><li><b>ب.</b> ملف قواعد الاستبقاء الحالي</li><li><b>ج.</b> مصفوفة موثوقية المصادر</li><li><b>د.</b> جدول الإسناد الترافقي: السجلات المصدرية خلف كل سجل ذهبي</li></ul></li>
<li><p>في سجل الأصول، نظام الصيانة يقطع وصف الأصل عند 40 حرفًا، ونظام المستودعات يحفظ الوصف كاملًا، وكلاهما يكتبه الموظف نفسه عند الاستلام. أي قاعدة لوصف الأصل؟</p><ul><li><b>أ.</b> الأحدث بين النظامين</li><li><b>ب.</b> الأكمل: الوصف الأطول بين النظامين</li><li><b>ج.</b> الأكثر تكرارًا بين النظامين</li><li><b>د.</b> أولوية المصدر: نظام الصيانة أولًا ثم المستودعات</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 2: قوائم الرموز والإشراف على البيانات</h2>
<ol>
<li><p>في سجل الجهات الشريكة يطلب المالك رقمًا واحدًا ليوافق على الدمج الآلي. أي رقم يحتاجه قبل غيره؟</p><ul><li><b>أ.</b> الاستدعاء على كل الأزواج الموسومة عند العتبتين</li><li><b>ب.</b> الدقة عند عتبة الدمج الآلي، لكل نظام كتابة</li><li><b>ج.</b> عدد الأزواج التي قورنت بعد التكتيل</li><li><b>د.</b> عدد العناقيد في السجل الذهبي</li></ul></li>
<li><p>في سجل الجهات الشريكة يرقّم سجل الاتفاقيات الدول بأرقام خاصة، والرقم 2 فيه يعني الإمارات. قائمتك للدول تتبع ISO 3166-1. أين يُكتب أن 2 يعني AE؟</p><ul><li><b>أ.</b> في قائمة الدول، رمزًا إضافيًا باسم 2</li><li><b>ب.</b> يُستبدل الرقم 2 بـ AE في سجل الاتفاقيات</li><li><b>ج.</b> في جدول المقابلة: سجل الاتفاقيات، 2، AE</li><li><b>د.</b> في تعريف رمز AE، ملاحظةً نصية يقرؤها المشرف</li></ul></li>
<li><p>في قائمة الجهات الشريكة: سجلان بلغتين، الاسمان مختلفان حرفيًا، ورقم الجهة فارغ في أحدهما. بريد المنسق واحد فيهما. النموذج يقترح «فصل» بثقة عالية. ماذا تكتب؟</p><ul><li><b>أ.</b> فصل، كما اقترح النموذج، فثقته عالية</li><li><b>ب.</b> تعيد السؤال إلى النموذج بعد إضافة البريد</li><li><b>ج.</b> إحالة إلى صاحب المصدر، فالرقم فارغ</li><li><b>د.</b> دمج، مع مخالفة النموذج، ودليله البريد</li></ul></li>
<li><p>في جامعة، أي هذه القوائم قائمة مرجعية داخلية تملكها الجامعة وتديرها؟</p><ul><li><b>أ.</b> أنواع البرامج التي تعرّفها الجامعة</li><li><b>ب.</b> رموز الدول وفق المعيار الدولي ISO 3166-1</li><li><b>ج.</b> رموز العملات وفق ISO 4217</li><li><b>د.</b> المناطق الإدارية وفق ISO 3166-2:SA</li></ul></li>
<li><p>في قائمة «نوع المادة» بمكتبة، قُسّم الرمز VID (مواد مرئية) إلى VID-DIG (رقمية) وVID-PHY (مادية) في الإصدار 2.0. ماذا تفعل بالرمز VID؟</p><ul><li><b>أ.</b> تحذفه من القائمة، فلم يعد يُستعمل</li><li><b>ب.</b> توقفه بتاريخ نهاية صلاحية وحالة retired، وتبقيه في القائمة</li><li><b>ج.</b> تبقيه نشطًا إلى جانب الرمزين الجديدين</li><li><b>د.</b> تغيّر اسمه إلى VID-DIG وتضيف VID-PHY</li></ul></li>
<li><p>في قائمة الدرجات الوظيفية، قُسّم الرمز G5 إلى G5A وG5B. في نظام الرواتب 640 موظفًا على G5، ونظام العقود يعرف الفرق لـ410 منهم. كم سجلًا يبقى لمشرف يحسمه؟</p><ul><li><b>أ.</b> 230</li><li><b>ب.</b> 410</li><li><b>ج.</b> 640</li><li><b>د.</b> 1,050</li></ul></li>
<li><p>فحص جدول المقابلة لقائمة «نوع المنشأة» يقول: السجلات المغطاة 9,700 من 10,000. ما معنى ذلك؟</p><ul><li><b>أ.</b> في القائمة 300 رمز بلا تعريف</li><li><b>ب.</b> رموز مصادر لـ300 سجل لم تُقابل برمز مرجعي</li><li><b>ج.</b> 300 سجل في المصادر مكررة وتحتاج مطابقة</li><li><b>د.</b> الإصدار الحالي أقدم من بيانات المصادر بـ300 سجل</li></ul></li>
<li><p>في قائمة مقاولي الصيانة، خالف قرار المشرف الأول اقتراح النموذج في 6 حالات. بعد قراءة الاقتراحات غيّر قراره إلى قرار النموذج في 5 منها، ولم يكتب دليلًا جديدًا في أي منها. ماذا يدل هذا؟</p><ul><li><b>أ.</b> على انحياز الأتمتة: غيّرته ثقة النموذج لا الدليل</li><li><b>ب.</b> على أن قرارات المشرف الأولى كانت خاطئة في 5 حالات</li><li><b>ج.</b> على أن النموذج أدق من المشرف في هذه القائمة</li><li><b>د.</b> على أن مستوى الخدمة قصير فاستعجل المشرف</li></ul></li>
<li><p>مستوى الخدمة لحالات المطابقة في قائمة المتعاقدين ثمانية أيام عمل، ومالك بيانات المتعاقدين مدير إدارة المرافق. متى تُصعّد الحالة المفتوحة، وإلى من؟</p><ul><li><b>أ.</b> بعد ستة عشر يوم عمل، إلى مكتب إدارة البيانات</li><li><b>ب.</b> بعد ستة أيام عمل، إلى مدير إدارة المرافق</li><li><b>ج.</b> لا تُصعّد، فالمشرف مسؤول عنها حتى تُحسم</li><li><b>د.</b> بعد ثمانية أيام عمل، إلى النموذج ليقترح قرارًا</li></ul></li>
<li><p>أي مؤشر من هذه تذكره ضوابط مكتب إدارة البيانات الوطنية حدًا أدنى لمؤشرات إدارة البيانات الرئيسة والمرجعية؟</p><ul><li><b>أ.</b> عدد الأزواج المقارنة بعد التكتيل</li><li><b>ب.</b> نسبة الحالات التي وافق فيها المشرف على النموذج</li><li><b>ج.</b> عدد مستخدمي المحور كل شهر</li><li><b>د.</b> متوسط زمن إصلاح مشكلات جودة البيانات الرئيسة والمرجعية</li></ul></li>
<li><p>في سجل الجهات الشريكة، الاسم والدولة ونوع الجهة مصنفة «عامة»، وهاتف المنسق وبريده وقيمة المنحة «مقيدة». ما الذي يجوز إرساله إلى أداة ذكاء اصطناعي توليدي مستضافة لدى الجهة؟</p><ul><li><b>أ.</b> السجل كاملًا، فالأداة لدى الجهة</li><li><b>ب.</b> الهاتف والبريد وحدهما، فهما أقصر من السجل</li><li><b>ج.</b> الاسم والدولة ونوع الجهة، فتصنيفها «عام»</li><li><b>د.</b> لا شيء من السجل، ولو كان مصنفًا «عامًا»</li></ul></li>
<li><p>في قائمة الجهات المانحة 450 زوجًا بين العتبتين، ومراجعة الزوج تأخذ 3 دقائق، وللمشرفة 5 ساعات أسبوعيًا للقائمة. كم أسبوعًا تحتاج؟</p><ul><li><b>أ.</b> 270 أسبوعًا</li><li><b>ب.</b> 4.5 أسابيع</li><li><b>ج.</b> 22.5 أسبوعًا</li><li><b>د.</b> 90 أسبوعًا</li></ul></li>
